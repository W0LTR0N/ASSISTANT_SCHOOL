services:
  app:
    build: .
    env_file: .env
    # УБРАНЫ прокси-переменные из environment!
    # Telegram бот использует свой прокси через AiohttpSession
    # HTTP клиент в integrations.py настроен отдельно
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
